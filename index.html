
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angles on a Straight Line – Mr. McLean Math</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--soft:#1c2440;--text:#f5f7ff;--muted:#aab3d4;--border:#2a355c;--accent:#ffb300;--good:#4caf50;--bad:#ff5252}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#182447 0,#050814 58%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 30px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px)}
.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.tabs,.modes,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
button.active,button.primary{background:var(--accent);border-color:var(--accent);color:#111}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.diagram{display:flex;justify-content:center;align-items:center;min-height:270px;margin:14px 0;border:1px solid var(--border);border-radius:14px;background:radial-gradient(circle at top,#1c2442 0,#070b19 60%)}
.diagram svg{width:min(100%,420px);height:auto}
.prompt{text-align:center;font-size:18px;font-weight:800;margin-top:8px}
.given{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.answer-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
input{font:inherit;font-size:20px;background:#070a18;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:170px;text-align:center}
.feedback{min-height:48px;margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;text-align:center}
.feedback.ok{color:var(--good);font-weight:850}.feedback.bad{color:var(--bad);font-weight:850}
.steps{display:none;margin-top:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#080c1c}
.steps.show{display:block}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.stat{padding:7px 11px;border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:800}
.worksheet{display:none}.ws-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;background:#070a18;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
.ws-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ws-item{border:1px solid var(--border);border-radius:12px;padding:10px;background:#080c1c}
.ws-title{font-weight:800;margin-bottom:5px}.ws-diagram{display:flex;justify-content:center;align-items:center;min-height:180px}
.ws-diagram svg{width:100%;max-width:240px;height:auto}
.ws-answer{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--good);font-weight:800}.ws-answer.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:680px){.ws-grid{grid-template-columns:1fr}.answer-row{align-items:stretch}.answer-row input{width:100%}}
@media print{body{background:#fff;color:#000}.wrap{max-width:none;padding:0}header,#practiceCard,.no-print,.footer{display:none!important}#worksheetCard{display:block!important;background:#fff;color:#000;border:0;padding:0}.ws-grid{grid-template-columns:repeat(2,1fr)}.ws-item{background:#fff;color:#000;border-color:#000}.ws-answer{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>Angles on a Straight Line</h1><div class="subtitle">Find the missing angle A. Angles on a straight line add up to 180°.</div></div>
<div class="tabs"><button id="practiceTab" class="active" type="button">Practice</button><button id="worksheetTab" type="button">Worksheet</button></div>
</header>

<section id="practiceCard" class="card">
<div class="toolbar">
<div><div class="label">Mode</div><div class="modes">
<button class="mode active" data-mode="basic" type="button">Basic</button>
<button class="mode" data-mode="advanced" type="button">Advanced</button>
</div></div>
<button id="newBtn" type="button">New Question</button>
</div>
<div id="diagram" class="diagram"></div>
<div id="prompt" class="prompt">Find angle A.</div>
<div id="given" class="given"></div>
<div class="answer-row">
<input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="A">
<span>°</span>
<button id="checkBtn" class="primary" type="button">Check</button>
<button id="nextBtn" type="button" disabled>Next</button>
<button id="clearBtn" type="button">Clear</button>
</div>
<div id="feedback" class="feedback">Enter the whole-number measure of angle A.</div>
<div id="steps" class="steps"></div>
<div class="stats"><div class="stat">Correct: <span id="correct">0</span></div><div class="stat">Incorrect: <span id="incorrect">0</span></div></div>
</section>

<section id="worksheetCard" class="card worksheet">
<div class="ws-top">
<div><div style="font-size:19px;font-weight:900">Worksheet</div><div id="wsMeta" class="subtitle">Find the missing angle A.</div></div>
<div class="row no-print">
<label style="font-size:13px;font-weight:800">Questions <select id="wsCount"><option>5</option><option selected>10</option><option>15</option></select></label>
<button id="wsGen" class="primary" type="button">Generate</button><button id="revealAll" type="button" disabled>Reveal All</button><button id="hideAll" type="button" disabled>Hide All</button><button id="printBtn" type="button" disabled>Print</button>
</div></div>
<div id="wsGrid" class="ws-grid"></div>
</section>
<div class="footer">Created by Mr. McLean Math.</div>
</div>
<script>
let questionCounter=0;
function randInt(min, max) {
return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateStraightLineQuestionBasic() {
const r = Math.random();
let n;
if (r < 0.4) n = 2;
else if (r < 0.75) n = 3;
else n = 4;

const minSeg = 20;
const total = 180;
const remaining = total - n * minSeg;

const cuts = [0];
for (let i = 0; i < n - 1; i++) cuts.push(randInt(0, remaining));
cuts.push(remaining);
cuts.sort(function (a, b) { return a - b; });

const segments = [];
for (let i = 0; i < n; i++) {
const bonus = cuts[i + 1] - cuts[i];
segments.push(minSeg + bonus);
}

const unknownIndex = randInt(0, n - 1);
const Avalue = segments[unknownIndex];

const boundaries = [0];
for (let i = 0; i < n; i++) boundaries.push(boundaries[i] + segments[i]);

const knownValues = [];
for (let i = 0; i < n; i++) if (i !== unknownIndex) knownValues.push(segments[i]);
const knownSum = knownValues.reduce((a, b) => a + b, 0);

return {
type: "basic",
id: ++questionCounter,
segments,
unknownIndex,
A: Avalue,
boundaries,
knownValues,
knownSum
};
}

function generateStraightLineQuestionAdvanced() {
// Choose k so that A = 180/(k+1) stays an integer:
// k in {2,3,4,5} => k+1 in {3,4,5,6} divides 180
const kOptions = [2, 3, 4, 5];
const k = kOptions[randInt(0, kOptions.length - 1)];
const Avalue = 180 / (k + 1);   // integer by design
const other = 180 - Avalue;     // = k*Avalue

// Decide whether A is on the left segment or right segment for variety
const AOnLeft = Math.random() < 0.5;

const segments = AOnLeft ? [Avalue, other] : [other, Avalue];
const unknownIndex = AOnLeft ? 0 : 1;

// boundaries for drawing (we still draw using true angles)
const boundaries = [0, segments[0], 180];

return {
type: "advanced",
id: ++questionCounter,
k,
AOnLeft,
segments,
unknownIndex,
A: Avalue,
boundaries
};
}

function generateQuestionByMode(mode) {
if (mode === "advanced") return generateStraightLineQuestionAdvanced();
return generateStraightLineQuestionBasic();
}

function createDiagramSVG(question) {
const size = 260;
const cx = size / 2;
const cy = size / 2 + 30;
const lineLen = 110;
const labelRadius = 70;

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(svgNS, "svg");
svg.setAttribute("viewBox", "0 0 " + size + " " + size);
svg.setAttribute("role", "img");
svg.setAttribute(
"aria-label",
"A straight line with angles on the top side, one labeled A."
);

function pointOnCircle(angleDeg, r) {
const rad = (angleDeg * Math.PI) / 180;
return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

// Base horizontal line
const left = pointOnCircle(180, lineLen);
const right = pointOnCircle(0, lineLen);
const baseLine = document.createElementNS(svgNS, "line");
baseLine.setAttribute("x1", left.x);
baseLine.setAttribute("y1", left.y);
baseLine.setAttribute("x2", right.x);
baseLine.setAttribute("y2", right.y);
baseLine.setAttribute("stroke", "#ffffff");
baseLine.setAttribute("stroke-width", "2.4");
svg.appendChild(baseLine);

const n = question.segments.length;
const boundaries = question.boundaries;

// Rays (internal boundaries only)
for (let i = 1; i < n; i++) {
const angleDeg = boundaries[i];
const outer = pointOnCircle(angleDeg, lineLen);
const ray = document.createElementNS(svgNS, "line");
ray.setAttribute("x1", cx);
ray.setAttribute("y1", cy);
ray.setAttribute("x2", outer.x);
ray.setAttribute("y2", outer.y);
ray.setAttribute("stroke", "#ffffff");
ray.setAttribute("stroke-width", "2.2");
svg.appendChild(ray);
}

// Labels
for (let i = 0; i < n; i++) {
const startDeg = boundaries[i];
const endDeg = boundaries[i + 1];
const midDeg = (startDeg + endDeg) / 2;

const labelPos = pointOnCircle(midDeg, labelRadius);
const text = document.createElementNS(svgNS, "text");
text.setAttribute("x", labelPos.x);
text.setAttribute("y", labelPos.y);
text.setAttribute("text-anchor", "middle");
text.setAttribute("dominant-baseline", "middle");
text.setAttribute("font-size", "13");
text.setAttribute("font-weight", "600");

if (question.type === "advanced") {
// Show "A" on the unknown segment; show "kA" on the other.
if (i === question.unknownIndex) {
text.setAttribute("fill", "#ffffff");
text.textContent = "A";
} else {
text.setAttribute("fill", "#ffcc80");
text.textContent = question.k + "A";
}
} else {
// Basic mode behavior
if (i === question.unknownIndex) {
text.setAttribute("fill", "#ffffff");
text.textContent = "A";
} else {
text.setAttribute("fill", "#ffcc80");
text.textContent = question.segments[i] + "°";
}
}

svg.appendChild(text);
}

return svg;
}

function buildStepsExplanation(question) {
const lines = [];

if (question.type === "advanced") {
lines.push("1. Angles on a straight line add up to 180°.");
lines.push("2. The diagram shows two angles: A and " + question.k + "A.");
lines.push("3. Write an equation: A + " + question.k + "A = 180.");
lines.push("4. Combine like terms: " + (question.k + 1) + "A = 180.");
lines.push("5. Divide both sides by " + (question.k + 1) + ": A = 180 / " + (question.k + 1) + " = " + question.A + "°.");
lines.push("6. (Check) The other angle is " + (180 - question.A) + "°.");
return lines;
}

// Basic mode
const segs = question.segments;
const n = segs.length;
const known = [];
for (let i = 0; i < n; i++) {
if (i !== question.unknownIndex) known.push(segs[i]);
}
const knownSum = known.reduce((a, b) => a + b, 0);
const A = question.A;

lines.push("1. Angles on a straight line add up to 180°.");
const descriptionParts = segs.map((val, idx) => (idx === question.unknownIndex ? "A" : val + "°"));
lines.push("2. Along this straight line we have the angles: " + descriptionParts.join(", ") + ".");
if (known.length > 0) {
lines.push("3. Add the known angles: " + known.map(v => v + "°").join(" + ") + " = " + knownSum + "°.");
}
lines.push("4. Since the total is 180°, A = 180° - " + knownSum + "° = " + A + "°.");
return lines;
}

let mode="basic",current=null,evaluated=false,correctCount=0,incorrectCount=0;

function parseAngleInput(val){
  if(val===null||val===undefined)return null;
  const s=String(val).trim();
  if(!s)return null;
  if(!/^\d+$/.test(s))return null;
  const n=Number(s);
  return Number.isInteger(n)?n:null;
}
function render(){
  current=generateQuestionByMode(mode);evaluated=false;
  const d=document.getElementById("diagram");d.innerHTML="";d.appendChild(createDiagramSVG(current));
  document.getElementById("given").textContent=mode==="advanced"
    ?`The other angle is ${current.k}A.`
    :"Angles on a straight line add up to 180°.";
  const a=document.getElementById("answer");a.value="";a.disabled=false;a.focus();
  document.getElementById("checkBtn").disabled=false;document.getElementById("nextBtn").disabled=true;
  document.getElementById("feedback").className="feedback";document.getElementById("feedback").textContent="Enter the whole-number measure of angle A.";
  document.getElementById("steps").className="steps";document.getElementById("steps").innerHTML="";
}
function check(){
  if(evaluated)return;
  const val=parseAngleInput(document.getElementById("answer").value);
  if(val===null){
    document.getElementById("feedback").className="feedback";
    document.getElementById("feedback").textContent="Enter a valid whole-number angle.";
    return;
  }
  evaluated=true;
  document.getElementById("answer").disabled=true;
  document.getElementById("checkBtn").disabled=true;
  document.getElementById("nextBtn").disabled=false;
  if(val===current.A){
    correctCount++;document.getElementById("correct").textContent=correctCount;
    document.getElementById("feedback").className="feedback ok";document.getElementById("feedback").textContent="Correct!";
  }else{
    incorrectCount++;document.getElementById("incorrect").textContent=incorrectCount;
    document.getElementById("feedback").className="feedback bad";document.getElementById("feedback").textContent=`Incorrect. A = ${current.A}°.`;
    const s=document.getElementById("steps");
    s.innerHTML=buildStepsExplanation(current).map(x=>`<div>${x}</div>`).join("");
    s.classList.add("show");
  }
}
function clearAnswer(){
  if(evaluated)return;
  document.getElementById("answer").value="";
  document.getElementById("answer").focus();
}

document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  mode=b.dataset.mode;render();
}));
document.getElementById("newBtn").addEventListener("click",render);
document.getElementById("checkBtn").addEventListener("click",check);
document.getElementById("nextBtn").addEventListener("click",render);
document.getElementById("clearBtn").addEventListener("click",clearAnswer);
document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();evaluated?render():check()}
  else if(e.key==="Escape"){e.preventDefault();clearAnswer()}
});

function showPractice(){document.getElementById("practiceTab").classList.add("active");document.getElementById("worksheetTab").classList.remove("active");document.getElementById("practiceCard").style.display="block";document.getElementById("worksheetCard").style.display="none"}
function showWorksheet(){document.getElementById("worksheetTab").classList.add("active");document.getElementById("practiceTab").classList.remove("active");document.getElementById("practiceCard").style.display="none";document.getElementById("worksheetCard").style.display="block"}
document.getElementById("practiceTab").addEventListener("click",showPractice);document.getElementById("worksheetTab").addEventListener("click",showWorksheet);

function wsItem(q,i){
  const c=document.createElement("div");c.className="ws-item";
  const t=document.createElement("div");t.className="ws-title";t.textContent=`${i}. Find angle A.`;
  const d=document.createElement("div");d.className="ws-diagram";d.appendChild(createDiagramSVG(q));
  const a=document.createElement("div");a.className="ws-answer";a.textContent=`Answer: A = ${q.A}°`;
  const b=document.createElement("button");b.type="button";b.className="no-print";b.textContent="Reveal";b.addEventListener("click",()=>{a.classList.toggle("show");b.textContent=a.classList.contains("show")?"Hide":"Reveal"});
  c.append(t,d,a,b);return c;
}
function generateWs(){
  const n=Number(document.getElementById("wsCount").value),grid=document.getElementById("wsGrid");grid.innerHTML="";
  for(let i=1;i<=n;i++)grid.appendChild(wsItem(generateQuestionByMode(mode),i));
  document.getElementById("wsMeta").textContent=`${mode==="basic"?"Basic":"Advanced"} • ${n} questions`;
  document.getElementById("revealAll").disabled=document.getElementById("hideAll").disabled=document.getElementById("printBtn").disabled=false;
}
document.getElementById("wsGen").addEventListener("click",generateWs);
document.getElementById("revealAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.add("show")));
document.getElementById("hideAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.remove("show")));
document.getElementById("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={generateStraightLineQuestionBasic,generateStraightLineQuestionAdvanced,buildStepsExplanation};
render();
</script>
</body>
</html>
